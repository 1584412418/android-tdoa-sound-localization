name: Build Debug APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 直接下载gradle 8.2原版wrapper.jar（官方直链）
      - name: Download official gradle-wrapper.jar
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar

      - name: 赋予执行权限
        run: chmod +x gradlew

      # Gradle官方action，自动校验wrapper、缓存依赖
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tdoa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
